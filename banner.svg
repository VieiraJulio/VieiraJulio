<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-label="Hi, I'm Julio Vieira">
  <title>Hi, I'm Julio Vieira</title>
  <style>
    :root {
      --texto: #1f2328;
      --cursor: #1a7f37;
      --mudo: #8c959f;
      --corpo: #1b1f24;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --texto: #e6edf3;
        --cursor: #3fb950;
        --mudo: #6e7681;
        --corpo: #2b3138;
      }
    }

    .texto rect { fill: var(--texto); }
    .texto { shape-rendering: crispEdges; }

    /* Digitação letra por letra */
    #revela { animation: digitar 10s steps(1, end) infinite; }
    @keyframes digitar { 0%{width:0} 7.60%{width:27px} 9.20%{width:37px} 10.80%{width:52px} 12.40%{width:67px} 14.00%{width:97px} 15.60%{width:112px} 17.20%{width:142px} 18.80%{width:157px} 20.40%{width:187px} 22.00%{width:217px} 23.60%{width:237px} 25.20%{width:247px} 26.80%{width:277px} 28.40%{width:292px} 30.00%{width:322px} 31.60%{width:332px} 33.20%{width:362px} 34.80%{width:372px} 36.40%{width:402px} 38.00%{width:432px} 92%{width:432px} 92.1%{width:0} 100%{width:0} }
    .cursor-pos { animation: mover 10s steps(1, end) infinite; }
    @keyframes mover { 0%{transform:translateX(0)} 7.60%{transform:translateX(25px)} 9.20%{transform:translateX(35px)} 10.80%{transform:translateX(50px)} 12.40%{transform:translateX(65px)} 14.00%{transform:translateX(95px)} 15.60%{transform:translateX(110px)} 17.20%{transform:translateX(140px)} 18.80%{transform:translateX(155px)} 20.40%{transform:translateX(185px)} 22.00%{transform:translateX(215px)} 23.60%{transform:translateX(235px)} 25.20%{transform:translateX(245px)} 26.80%{transform:translateX(275px)} 28.40%{transform:translateX(290px)} 30.00%{transform:translateX(320px)} 31.60%{transform:translateX(330px)} 33.20%{transform:translateX(360px)} 34.80%{transform:translateX(370px)} 36.40%{transform:translateX(400px)} 38.00%{transform:translateX(430px)} 92%{transform:translateX(430px)} 92.1%{transform:translateX(0)} 100%{transform:translateX(0)} }
    .cursor { fill: var(--cursor); animation: piscar .9s steps(1, end) infinite; shape-rendering: crispEdges; }
    @keyframes piscar { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    /* Barrinha de loading (scanner) */
    .seg { fill: var(--mudo); opacity: .25; animation: scan 2.2s steps(1, end) infinite; shape-rendering: crispEdges; }
    @keyframes scan {
      0% { opacity: 1; fill: var(--cursor); }
      12% { opacity: .55; fill: var(--cursor); }
      24% { opacity: .25; fill: var(--mudo); }
      100% { opacity: .25; fill: var(--mudo); }
    }

    /* Cubo mágico sendo montado peça por peça */
    .cubo { animation: flutuar 5s ease-in-out infinite; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .peca {
      transform-box: fill-box;
      transform-origin: center;
      animation: montar 10s ease-in-out infinite both;
    }
    @keyframes montar {
      0%   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.25); opacity: 0; }
      20%  { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      84%  { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      95%, 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.25); opacity: 0; }
    }
    .corpo { fill: var(--corpo); stroke: var(--corpo); stroke-width: 1.5; stroke-linejoin: round; }
    .adesivo { stroke-width: 2.4; stroke-linejoin: round; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #revela { width: 432px; }
      .cursor { opacity: 0; }
    }
  </style>

