<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Hi, I'm Julio Vieira">
  <title>Hi, I'm Julio Vieira</title>
  <style>
    :root {
      --texto: #1f2328;
      --acento: #0969da;
      --acento2: #2da44e;
      --grade: #d0d7de;
      --barra: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --texto: #f0f6fc;
        --acento: #58a6ff;
        --acento2: #3fb950;
        --grade: #30363d;
        --barra: #1f6feb;
      }
    }

    .titulo {
      fill: var(--texto);
      font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 40px;
      font-weight: 700;
    }
    .emoji {
      font-size: 40px;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      transform-box: fill-box;
      transform-origin: 70% 80%;
      animation: acenar 2.4s ease-in-out infinite;
    }
    @keyframes acenar {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(16deg); }
      20% { transform: rotate(-10deg); }
      30% { transform: rotate(16deg); }
      40% { transform: rotate(-6deg); }
      50% { transform: rotate(10deg); }
    }

    /* Título "digitando", repete a cada ciclo */
    #revela {
      animation: digitar 7s steps(24, end) infinite;
    }
    @keyframes digitar {
      0%   { width: 0; }
      35%  { width: 448px; }
      92%  { width: 448px; }
      100% { width: 0; }
    }
    .cursor {
      fill: var(--acento);
      animation: cursor 7s linear infinite;
    }
    @keyframes cursor {
      0%   { transform: translateX(0); opacity: 1; }
      35%  { transform: translateX(440px); opacity: 1; }
      40%  { transform: translateX(440px); opacity: 0; }
      45%  { transform: translateX(440px); opacity: 1; }
      50%  { transform: translateX(440px); opacity: 0; }
      55%  { transform: translateX(440px); opacity: 1; }
      92%  { transform: translateX(440px); opacity: 1; }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* Sublinhado com brilho passando */
    .sublinhado { fill: url(#grad); transform-box: fill-box; transform-origin: left; animation: crescer 7s ease-in-out infinite; }
    @keyframes crescer {
      0%   { transform: scaleX(0); }
      35%  { transform: scaleX(1); }
      92%  { transform: scaleX(1); }
      100% { transform: scaleX(0); }
    }

    /* Gráfico de dados */
    .grade { stroke: var(--grade); stroke-width: 1; stroke-dasharray: 3 5; }
    .base  { stroke: var(--grade); stroke-width: 1.5; }
    .barra {
      fill: var(--barra);
      opacity: .85;
      transform-box: fill-box;
      transform-origin: bottom;
      animation: pulsar 4.2s ease-in-out infinite;
    }
    @keyframes pulsar {
      0%   { transform: scaleY(0); }
      18%  { transform: scaleY(1); }
      55%  { transform: scaleY(.62); }
      80%  { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }
    .linha {
      fill: none;
      stroke: var(--acento2);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 286;
      stroke-dashoffset: 286;
      animation: desenhar 4.2s ease-in-out infinite;
    }
    @keyframes desenhar {
      0%   { stroke-dashoffset: 286; }
      45%  { stroke-dashoffset: 0; }
      85%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -286; }
    }
    .ponto {
      fill: var(--acento2);
      transform-box: fill-box;
      transform-origin: center;
      animation: brilho 2.2s ease-in-out infinite;
    }
    @keyframes brilho {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.7); opacity: .5; }
    }

    /* Fluxo de dados (pipeline) abaixo do título */
    .fluxo {
      fill: var(--acento);
      animation: correr 3.2s linear infinite;
    }
    @keyframes correr {
      0%   { transform: translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(430px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #revela { width: 448px; }
      .linha { stroke-dashoffset: 0; }
      .sublinhado { transform: none; }
    }
  </style>

  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#2da44e"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <clipPath id="clipTitulo">
      <rect id="revela" x="78" y="40" width="0" height="70"/>
    </clipPath>
  </defs>

  <!-- Emoji acenando -->
  <text class="emoji" x="22" y="92">👋</text>

  <!-- Título com efeito de digitação -->
  <g clip-path="url(#clipTitulo)">
    <text class="titulo" x="78" y="92" textLength="440" lengthAdjust="spacingAndGlyphs">Hi, I'm Julio Vieira</text>
  </g>
  <rect class="cursor" x="78" y="56" width="3" height="46" rx="1.5"/>

  <!-- Sublinhado -->
  <rect class="sublinhado" x="78" y="108" width="440" height="4" rx="2"/>

  <!-- Fluxo de dados: pontos correndo como num pipeline -->
  <g>
    <circle class="fluxo" cx="78" cy="130" r="3" style="animation-delay:0s"/>
    <circle class="fluxo" cx="78" cy="130" r="3" style="animation-delay:.8s"/>
    <circle class="fluxo" cx="78" cy="130" r="3" style="animation-delay:1.6s"/>
    <circle class="fluxo" cx="78" cy="130" r="3" style="animation-delay:2.4s"/>
  </g>

  <!-- Gráfico de dados -->
  <g>
    <line class="grade" x1="560" x2="860" y1="85" y2="85"/>
    <line class="grade" x1="560" x2="860" y1="35" y2="35"/>
    <line class="base" x1="560" x2="860" y1="135" y2="135"/>
    <rect class="barra" x="567.9" y="97.0" width="21.8" height="38.0" rx="3" style="animation-delay:0.90s"/>
    <rect class="barra" x="605.4" y="80.0" width="21.8" height="55.0" rx="3" style="animation-delay:1.02s"/>
    <rect class="barra" x="642.9" y="90.0" width="21.8" height="45.0" rx="3" style="animation-delay:1.14s"/>
    <rect class="barra" x="680.4" y="63.0" width="21.8" height="72.0" rx="3" style="animation-delay:1.26s"/>
    <rect class="barra" x="717.9" y="73.0" width="21.8" height="62.0" rx="3" style="animation-delay:1.38s"/>
    <rect class="barra" x="755.4" y="47.0" width="21.8" height="88.0" rx="3" style="animation-delay:1.50s"/>
    <rect class="barra" x="792.9" y="57.0" width="21.8" height="78.0" rx="3" style="animation-delay:1.62s"/>
    <rect class="barra" x="830.4" y="35.0" width="21.8" height="100.0" rx="3" style="animation-delay:1.74s"/>
    <path class="linha" d="M 578.8 91.0 L 616.2 79.0 L 653.8 85.0 L 691.2 63.0 L 728.8 69.0 L 766.2 47.0 L 803.8 53.0 L 841.2 29.0"/>
    <circle class="ponto" cx="578.8" cy="91.0" r="3.2" style="animation-delay:1.60s"/>
    <circle class="ponto" cx="616.2" cy="79.0" r="3.2" style="animation-delay:1.82s"/>
    <circle class="ponto" cx="653.8" cy="85.0" r="3.2" style="animation-delay:2.04s"/>
    <circle class="ponto" cx="691.2" cy="63.0" r="3.2" style="animation-delay:2.26s"/>
    <circle class="ponto" cx="728.8" cy="69.0" r="3.2" style="animation-delay:2.48s"/>
    <circle class="ponto" cx="766.2" cy="47.0" r="3.2" style="animation-delay:2.70s"/>
    <circle class="ponto" cx="803.8" cy="53.0" r="3.2" style="animation-delay:2.92s"/>
    <circle class="ponto" cx="841.2" cy="29.0" r="3.2" style="animation-delay:3.14s"/>
  </g>
</svg>
