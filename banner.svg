<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Hi, I'm Julio Vieira">
  <title>Hi, I'm Julio Vieira</title>
  <style>
    :root {
      --texto: #1f2328;
      --cursor: #1a7f37;
      --topo: #2da44e;
      --esq: #1a7f37;
      --dir: #116329;
      --quente: #bf8700;
      --mudo: #8c959f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --texto: #e6edf3;
        --cursor: #3fb950;
        --topo: #3fb950;
        --esq: #2ea043;
        --dir: #196c2e;
        --quente: #e3b341;
        --mudo: #6e7681;
      }
    }

    .texto rect { fill: var(--texto); }
    .texto { shape-rendering: crispEdges; }

    /* Digitação letra por letra */
    #revela { animation: digitar 8s steps(1, end) infinite; }
    @keyframes digitar { 0%{width:0} 7.60%{width:32px} 9.20%{width:44px} 10.80%{width:62px} 12.40%{width:80px} 14.00%{width:116px} 15.60%{width:134px} 17.20%{width:170px} 18.80%{width:188px} 20.40%{width:224px} 22.00%{width:260px} 23.60%{width:284px} 25.20%{width:296px} 26.80%{width:332px} 28.40%{width:350px} 30.00%{width:386px} 31.60%{width:398px} 33.20%{width:434px} 34.80%{width:446px} 36.40%{width:482px} 38.00%{width:518px} 92%{width:518px} 92.1%{width:0} 100%{width:0} }
    .cursor-pos { animation: mover 8s steps(1, end) infinite; }
    @keyframes mover { 0%{transform:translateX(0)} 7.60%{transform:translateX(30px)} 9.20%{transform:translateX(42px)} 10.80%{transform:translateX(60px)} 12.40%{transform:translateX(78px)} 14.00%{transform:translateX(114px)} 15.60%{transform:translateX(132px)} 17.20%{transform:translateX(168px)} 18.80%{transform:translateX(186px)} 20.40%{transform:translateX(222px)} 22.00%{transform:translateX(258px)} 23.60%{transform:translateX(282px)} 25.20%{transform:translateX(294px)} 26.80%{transform:translateX(330px)} 28.40%{transform:translateX(348px)} 30.00%{transform:translateX(384px)} 31.60%{transform:translateX(396px)} 33.20%{transform:translateX(432px)} 34.80%{transform:translateX(444px)} 36.40%{transform:translateX(480px)} 38.00%{transform:translateX(516px)} 92%{transform:translateX(516px)} 92.1%{transform:translateX(0)} 100%{transform:translateX(0)} }
    .cursor { fill: var(--cursor); animation: piscar .9s steps(1, end) infinite; shape-rendering: crispEdges; }
    @keyframes piscar { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

    /* Barrinha de loading (scanner) */
    .seg { fill: var(--mudo); opacity: .25; animation: scan 2.2s steps(1, end) infinite; shape-rendering: crispEdges; }
    @keyframes scan {
      0% { opacity: 1; fill: var(--cursor); }
      12% { opacity: .55; fill: var(--cursor); }
      24% { opacity: .25; fill: var(--mudo); }
      100% { opacity: .25; fill: var(--mudo); }
    }

    /* Cubo de dados */
    .cubo { animation: flutuar 5s ease-in-out infinite; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .camada { animation: subir 6s ease-in-out infinite; }
    @keyframes subir {
      0%, 15%, 70%, 100% { transform: translateY(0); }
      35%, 55% { transform: translateY(-15px); }
    }
    .topo { fill: var(--topo); }
    .esq  { fill: var(--esq); }
    .dir  { fill: var(--dir); }
    .quente { fill: var(--quente) !important; }
    .cel, .quente { animation-name: brilhar; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    @keyframes brilhar { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #revela { width: 518px; }
      .cursor { opacity: 0; }
    }
  </style>

