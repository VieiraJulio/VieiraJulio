name: Generate GitHub metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml   # regera quando a configuração mudar

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # Card único e minimalista: perfil + linguagens mais usadas
      - name: Profile card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update ${filename} [skip ci]"
          user: VieiraJulio
          template: classic
          base: header
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook   # notebooks inflam o tamanho e escondem o resto
          plugin_languages_threshold: 0%
